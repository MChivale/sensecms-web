[demo-sensecms]
user = demo-sensecms
group = demo-sensecms
listen = /run/php/php8.5-demo-sensecms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 20s
pm.max_requests = 500
clear_env = yes
security.limit_extensions = .php
catch_workers_output = yes
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[expose_php] = off
php_admin_flag[opcache.validate_permission] = on
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 80M
php_admin_value[post_max_size] = 96M
php_admin_flag[session.cookie_httponly] = on
php_admin_flag[session.cookie_secure] = on
php_admin_value[session.save_path] = /home/demo.sensecms.com/web/storage/sessions
php_admin_value[upload_tmp_dir] = /home/demo.sensecms.com/web/storage/tmp
php_admin_value[sys_temp_dir] = /home/demo.sensecms.com/web/storage/tmp
php_admin_value[error_log] = /home/demo.sensecms.com/web/storage/php-error.log
