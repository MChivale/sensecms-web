# Install as /etc/nginx/sites-available/sensecms.com.
# Public website files belong in /home/sensecms.com/web/public.
server {
    listen 80;
    listen [::]:80;
    server_name sensecms.com www.sensecms.com;

    return 301 https://www.sensecms.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sensecms.com;

    ssl_certificate /etc/letsencrypt/live/sensecms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensecms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 301 https://www.sensecms.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sensecms.com;
    root /home/sensecms.com/web/public;
    index index.php index.html;
    autoindex off;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/sensecms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensecms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/sensecms.com.access.log;
    error_log /var/log/nginx/sensecms.com.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|sqlite(?:3)?|bak|key|pem|phar|phtml)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
