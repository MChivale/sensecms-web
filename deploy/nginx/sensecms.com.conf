# Install as /etc/nginx/sites-available/sensecms.com.
# Public website files belong in /home/sensecms.com/web/public.
limit_req_zone $binary_remote_addr zone=sensecms_telegram_webhook:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sensecms_telegram_client:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=sensecms_meta_oauth:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=sensecms_x_oauth:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=sensecms_linkedin_oauth:1m rate=3r/s;
limit_req_zone $binary_remote_addr zone=sensecms_bluesky_oauth:1m rate=3r/s;
server {
    listen 80;
    listen [::]:80;
    server_name sensecms.com www.sensecms.com;

    return 301 https://www.sensecms.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sensecms.com;

    ssl_certificate /etc/letsencrypt/live/sensecms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensecms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    return 301 https://www.sensecms.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.sensecms.com;
    root /home/sensecms.com/web/public;
    index index.php index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 96m;

    ssl_certificate /etc/letsencrypt/live/sensecms.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sensecms.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    access_log /var/log/nginx/sensecms.com.access.log;
    error_log /var/log/nginx/sensecms.com.error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(?:env|ini|log|sql|sqlite(?:3)?|bak|key|pem|phar|phtml)$ {
        return 404;
    }

    location / {
        client_max_body_size 16k;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:content|profile|settings|appearance|system|api)(?:/|$) {
        client_max_body_size 96m;
        rewrite ^ /index.php last;
    }

    location = /api/telegram/v1/webhook {
        limit_req zone=sensecms_telegram_webhook burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/telegram-webhook.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ^~ /api/telegram/v1/ {
        limit_req zone=sensecms_telegram_client burst=10 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/telegram-webhook.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ^~ /api/social/meta/v1/ {
        limit_req zone=sensecms_meta_oauth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/meta-oauth.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ^~ /api/social/x/v1/ {
        limit_req zone=sensecms_x_oauth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/x-oauth.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ^~ /api/social/linkedin/v1/ {
        limit_req zone=sensecms_linkedin_oauth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/linkedin-oauth.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ^~ /api/social/bluesky/v1/ {
        limit_req zone=sensecms_bluesky_oauth burst=12 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/bluesky-oauth.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location = /api/updates/v1/catalog {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /home/sensecms.com/web/website/core-releases.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location = /index.php {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_pass unix:/run/php/php8.5-sensecms.sock;
    }

    location ~* \.php(?:/|$) {
        return 404;
    }
}
